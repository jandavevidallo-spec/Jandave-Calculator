    showGraphResult(label, x, y) {
      const g = this.state.graph;
      g.trace = true; g.traceX = x;
      this.closeLcdModal();
      this.drawGraph();
      this.DOM.graphStatus.textContent = `${label}: x=${math.round(x, 6)}  y=${math.round(y, 6)}`;
    },

    gsolveRoot() {
      const g = this.state.graph, N = 800;
      let prevX = g.xmin, prevY = this.sampleFn(g.y1, prevX);
      for (let i = 1; i <= N; i++) {
        const x = g.xmin + (i / N) * (g.xmax - g.xmin);
        const y = this.sampleFn(g.y1, x);
        if (isFinite(prevY) && isFinite(y) && prevY * y < 0) {
          let lo = prevX, hi = x;
          for (let k = 0; k < 40; k++) {
            const mid = (lo + hi) / 2;
            if (this.sampleFn(g.y1, lo) * this.sampleFn(g.y1, mid) <= 0) hi = mid; else lo = mid;
          }
          const rx = (lo + hi) / 2;
          this.showGraphResult('Root', rx, this.sampleFn(g.y1, rx));
          return;
        }
        prevX = x; prevY = y;
      }
      this.showLcdModal('G-Solve', '<p class="p-2 text-rose-700 font-bold">No root found in current view.</p>');
    },

    gsolveExtremum(kind) {
      const g = this.state.graph, N = 800;
      let best = null, bestY = kind === 'min' ? Infinity : -Infinity;
      for (let i = 0; i <= N; i++) {
        const x = g.xmin + (i / N) * (g.xmax - g.xmin);
        const y = this.sampleFn(g.y1, x);
        if (!isFinite(y)) continue;
        if ((kind === 'min' && y < bestY) || (kind === 'max' && y > bestY)) { bestY = y; best = x; }
      }
      if (best === null) { this.showLcdModal('G-Solve', '<p class="p-2 text-rose-700 font-bold">No extremum found.</p>'); return; }
      const span = (g.xmax - g.xmin) / N;
      let lo = best - span, hi = best + span;
      const phi = (Math.sqrt(5) - 1) / 2;
      for (let k = 0; k < 60; k++) {
        const c = hi - phi * (hi - lo), d = lo + phi * (hi - lo);
        const fc = this.sampleFn(g.y1, c), fd = this.sampleFn(g.y1, d);
        if (kind === 'min' ? fc < fd : fc > fd) hi = d; else lo = c;
      }
      const rx = (lo + hi) / 2;
      this.showGraphResult(kind === 'min' ? 'Min' : 'Max', rx, this.sampleFn(g.y1, rx));
    },

    gsolveYInt() {
      const g = this.state.graph;
      this.showGraphResult('Y-Int', 0, this.sampleFn(g.y1, 0));
    },

    gsolveIntersect() {
      const g = this.state.graph;
      if (!g.y2) { this.showLcdModal('G-Solve', '<p class="p-2 text-rose-700 font-bold">Set Y2 first.</p>'); return; }
      const N = 800;
      let prevX = g.xmin, prevD = this.sampleFn(g.y1, prevX) - this.sampleFn(g.y2, prevX);
      for (let i = 1; i <= N; i++) {
        const x = g.xmin + (i / N) * (g.xmax - g.xmin);
        const d = this.sampleFn(g.y1, x) - this.sampleFn(g.y2, x);
        if (isFinite(prevD) && isFinite(d) && prevD * d < 0) {
          let lo = prevX, hi = x;
          for (let k = 0; k < 40; k++) {
            const mid = (lo + hi) / 2;
            const fm = this.sampleFn(g.y1, mid) - this.sampleFn(g.y2, mid);
            const flo = this.sampleFn(g.y1, lo) - this.sampleFn(g.y2, lo);
            if (flo * fm <= 0) hi = mid; else lo = mid;
          }
          const rx = (lo + hi) / 2;
          this.showGraphResult('Isect', rx, this.sampleFn(g.y1, rx));
          return;
        }
        prevX = x; prevD = d;
      }
      this.showLcdModal('G-Solve', '<p class="p-2 text-rose-700 font-bold">No intersection found in current view.</p>');
    },
    convertToDmsDisplay() {
      try {
        let raw = this.getRawExpression().trim() || this.state.lastCalculatedAnswer;
        let ev = this.balanceParens(this.addImplicitMultiplication(this.convertDms(this.getEvalExpression(raw))));
        const val = math.evaluate(ev);
        if (typeof val !== 'number' || !isFinite(val)) return;
        const sign = val < 0 ? '-' : '';
        const abs = Math.abs(val);
        const d = Math.floor(abs);
        const mFull = (abs - d) * 60;
        const m = Math.floor(mFull);
        const s = (mFull - m) * 60;
        this.renderKatex(`${sign}${d}^{\\circ}\\,${m}'\\,${math.round(s, 3)}''`, this.DOM.bigDisplay);
        this.DOM.smallResult.innerHTML = `<span class="text-xs font-bold text-slate-700">DMS Convert</span>`;
      } catch (e) {  }
    },
    convertDms(str) {
      return str
        .replace(/(-?\d+(?:\.\d+)?)°(\d+(?:\.\d+)?)°(\d+(?:\.\d+)?)/g, 'dms($1,$2,$3)')
        .replace(/(-?\d+(?:\.\d+)?)°(\d+(?:\.\d+)?)(?!\d*°)/g, 'dms($1,$2,0)')
        .replace(/(-?\d+(?:\.\d+)?)°(?!\d)/g, 'dms($1,0,0)');
    },

    calculate() {
      if (this.state.activeMode === 'GRAPH') {
        this.drawGraph();
        return;
      }
      if (this.state.activeMode === 'ALGEBRA') {
        this.performAlgebra('simplify');
        return;
      }

      let raw = this.getRawExpression().trim();
      if (!raw) return;

      try {
        let evalStr = this.getEvalExpression(raw);
        evalStr = this.convertDms(evalStr);
        evalStr = this.addImplicitMultiplication(evalStr);
        evalStr = this.balanceParens(evalStr);
        const scope = {
           A: this.memory.A, B: this.memory.B, C: this.memory.C,
           D: this.memory.D, E: this.memory.E, F: this.memory.F,
           X: this.memory.X, Y: this.memory.Y, M: this.memory.M,
           MatA: this.matrices.A, MatB: this.matrices.B, MatC: this.matrices.C,
           VctA: this.vectors.A, VctB: this.vectors.B, VctC: this.vectors.C
        };
        let res = math.evaluate(evalStr, scope);
        let displayRes = '';

        if (typeof res === 'number') {
          displayRes = math.format(res, { precision: 15, lowerExp: -12, upperExp: 15 });
        } else if (res && res.isResultSet) {
          displayRes = '[' + res.entries.map(e => math.format(e, {precision: 10})).join(', ') + ']';
        } else if (math.typeOf(res) === 'Matrix' || Array.isArray(res)) {
          displayRes = math.parse(JSON.stringify(res)).toTex();
        } else {
          displayRes = res.toString();
        }
        if (!displayRes.includes('\\')) { // Not LaTeX (Standard numerical output)
          this.state.lastCalculatedAnswer = displayRes;
          this.saveToHistory(this.getPlainExpression(raw), displayRes);
          
          this.state.mainExpr = displayRes;
          this.state.mainCursor = displayRes.length;
          this.state.activeFrac = null;
          this.renderPreview();
          
          this.DOM.smallResult.innerHTML = `<span class="text-xs text-slate-700 font-bold">Ans = ${displayRes}</span>`;
          if (this.state.activeMode === 'BASE' && typeof res === 'number') this.showBaseTable(res);
        } else { // Complex output (Matrices/Vectors represented via LaTeX)
          this.DOM.smallResult.innerHTML = `<span class="text-xs font-bold text-slate-700">Matrix/Vector Eval</span>`;
          this.renderKatex(displayRes, this.DOM.bigDisplay);
          this.saveToHistory(this.getPlainExpression(raw), 'Matrix/Vector');
        }

      } catch (e) {
        this.DOM.smallResult.innerHTML = `<span class="text-xs font-bold text-rose-700">Syntax Error</span>`;
        console.error(e);
      }
    }
  };
  window.addEventListener('DOMContentLoaded', () => {
    Calculator.init();
  });
</script>



<script>
  document.addEventListener('click', function (evt) {
    const target = evt.target.closest('[data-onclick]');
    if (!target) return;

    const code = target.getAttribute('data-onclick');
    if (!code) return;

    try {
      new Function(code).call(target);
    } catch (err) {
      console.error('Action dispatch error for data-onclick="' + code + '":', err);
    }
  }, false);
</script>
